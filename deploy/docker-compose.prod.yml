# shopbuket1 production stack — isolated Compose project (domain-neutral).
# Usage (from repo root on the VPS):
#   export SHOPBUKET1_ENV_FILE=/etc/shopbuket1/production.env
#   docker compose -p shopbuket1 -f deploy/docker-compose.prod.yml --env-file "$SHOPBUKET1_ENV_FILE" up -d
#
# Sibling ERP stack uses project "erpbuket1" — never share volumes/networks.
# Does NOT publish Postgres. API/Web bind to loopback only for host Nginx.

name: shopbuket1

services:
  postgres:
    image: postgres:17-alpine
    container_name: shopbuket1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shopbuket1_pgdata:/var/lib/postgresql/data
    networks:
      - shopbuket1_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  api:
    image: ${SHOPBUKET1_API_IMAGE:-shopbuket1-api:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: shopbuket1-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${SHOPBUKET1_ENV_FILE:?Set SHOPBUKET1_ENV_FILE to the absolute production env path}
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      # DATABASE_URL must come from the env file and use Docker DNS host "postgres".
      # Internal storefront revalidation (no public HTTPS hop). Override via env file if needed.
      # Secret stays optional: unset REVALIDATE_SECRET ⇒ fail-soft no-op in API.
      REVALIDATE_URL: ${REVALIDATE_URL:-http://web:3000/api/revalidate}
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - shopbuket1_internal
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    mem_limit: 1536m
    mem_reservation: 512m

  web:
    image: ${SHOPBUKET1_WEB_IMAGE:-shopbuket1-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
        MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    container_name: shopbuket1-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${SHOPBUKET1_ENV_FILE:?Set SHOPBUKET1_ENV_FILE to the absolute production env path}
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - shopbuket1_internal
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    mem_limit: 1024m
    mem_reservation: 384m

  # Optional ERP/simulator outbox worker:
  #   docker compose -p shopbuket1 -f deploy/docker-compose.prod.yml --profile integrations up -d
  worker:
    profiles: ['integrations']
    image: ${SHOPBUKET1_API_IMAGE:-shopbuket1-api:local}
    container_name: shopbuket1-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ${SHOPBUKET1_ENV_FILE:?Set SHOPBUKET1_ENV_FILE to the absolute production env path}
    environment:
      NODE_ENV: production
    networks:
      - shopbuket1_internal
    command: ['node', 'dist/worker-main.js']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    mem_limit: 512m
    mem_reservation: 128m

networks:
  shopbuket1_internal:
    name: shopbuket1_internal
    driver: bridge

volumes:
  shopbuket1_pgdata:
    name: shopbuket1_pgdata
