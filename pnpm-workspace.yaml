packages:
  - "apps/*"
  - "packages/*"

# Required for portable `pnpm deploy` output (Docker production images).
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - nestjs-pino
  - prisma
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - "@scarf/scarf"
